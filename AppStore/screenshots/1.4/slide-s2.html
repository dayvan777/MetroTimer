<!doctype html><html lang="uk"><head><meta charset="utf-8"><style>
* { margin:0; box-sizing:border-box; }
html,body { width:1320px; height:2868px; overflow:hidden; }
body { background:
   radial-gradient(90% 38% at 50% 36%, rgba(228,32,42,.45) 0, transparent 70%),
   linear-gradient(#050608, #07080b 60%, #050506);
  font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif; color:#f2f2f0;
  -webkit-font-smoothing:antialiased; position:relative; }
.rail { position:absolute; left:54px; top:0; width:6px; height:520px;
  background:linear-gradient(#ff3a2d 0, #ff3a2d 55%, transparent); opacity:.9; }
.dot { position:absolute; left:39px; top:262px; width:36px; height:36px; border-radius:50%;
  background:#ff3a2d; box-shadow:0 0 0 8px #050608, 0 0 30px #ff3a2d; }
h1 { position:absolute; left:128px; top:208px; font-weight:800; font-size:112px; line-height:1.06; letter-spacing:-1.5px; }
h1 span { color:#ff3a2d; display:block; }
.sub { position:absolute; left:130px; top:470px; width:1080px; font-size:50px; line-height:1.28; color:#a3a29c; font-weight:500; }
.phone { position:absolute; left:110px; top:720px; width:1100px; border-radius:118px; padding:14px;
  background:linear-gradient(#2c2c30,#18181b); box-shadow:0 0 0 2px #3a3a3f, 0 60px 140px rgba(0,0,0,.85), 0 0 120px rgba(228,32,42,.2); }
.phone img { display:block; width:100%; border-radius:104px; }
.banner { position:absolute; left:82px; top:676px; width:1156px; height:207px; border-radius:56px;
  background:url(banner_src.png) -22.75px -162px / 1201px 2610px no-repeat;
  box-shadow:0 30px 80px rgba(0,0,0,.75); }
</style></head><body>
<div class="rail"></div><div class="dot"></div>
<h1>Відлік<span>у Dynamic Island</span></h1>
<div class="sub">Кільце і смуга зі станціями рухаються самі, без розблокування</div>

<div class="phone"><img src="island.png"></div>
</body></html>
